title: Oliver Scheiwiller
tagline: not fast, not funny
description: >-
  Runner and enterprise architect. Personal site, terminal-styled.
  Currently architecting at Scandit, in Zürich.
url: https://oschei.com
lang: en

author:
  name: Oliver Scheiwiller

social:
  name: Oliver Scheiwiller
  links:
    - https://www.linkedin.com/in/oschei/
    - https://github.com/oschei

# Easy-to-edit profile links surfaced in contact + JSON-LD
linkedin_url: https://www.linkedin.com/in/oschei/
github_url:   https://github.com/oschei
strava_url:   https://www.strava.com/athletes/guapito
goodreads_url: https://www.goodreads.com/oschei
calendly_url: ""

# Analytics — GoatCounter code (just the subdomain prefix)
goatcounter_code: "oschei"

# Twitter card type — large image since the OG card is 1200×630
twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections for projects
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.png
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Files / directories Jekyll should process even though they start with _
include:
  - _pages

# Build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - script/
  - vendor/
  - docs/
  - .superpowers/
  - "*.log"
