<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1b26" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e1e2e7" media="(prefers-color-scheme: light)">

  {%- comment -%} SEO + OG handled by jekyll-seo-tag {%- endcomment -%}
  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    // Theme persistence — run before paint to avoid FOUC
    (function () {
      var t = localStorage.getItem('oschei.theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    })();
  </script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="term">
    {% include terminal-chrome.html title=page.term_title %}
    <main id="main" class="term-body">
      {{ content }}
    </main>
  </div>
</body>
</html>
