<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="scan" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#1a1b26"/>
      <rect y="2" width="1" height="1" fill="#1c1d29"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#1a1b26"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Terminal chrome bar -->
  <rect x="60" y="60" width="1080" height="48" fill="#16161e"/>
  <circle cx="92" cy="84" r="8" fill="#f7768e"/>
  <circle cx="118" cy="84" r="8" fill="#e0af68"/>
  <circle cx="144" cy="84" r="8" fill="#9ece6a"/>
  <text x="180" y="90" fill="#565f89" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1">guest@oschei.com — ~ — zsh</text>

  <!-- Body -->
  <text x="100" y="180" fill="#565f89" font-family="JetBrains Mono, monospace" font-size="22">guest@oschei.com:~$ <tspan fill="#c0caf5">cat about.md</tspan></text>

  <text x="100" y="290" fill="#c0caf5" font-family="JetBrains Mono, monospace" font-size="84" font-weight="700">
    <tspan fill="#565f89">#</tspan> Oliver Scheiwiller
  </text>

  <text x="100" y="370" fill="#9aa5ce" font-family="JetBrains Mono, monospace" font-size="28" font-style="italic">Runner and enterprise architect, amongst other things.</text>

  <text x="100" y="490" fill="#565f89" font-family="JetBrains Mono, monospace" font-size="20"># </text>
  <text x="125" y="490" fill="#ff9e64" font-family="JetBrains Mono, monospace" font-size="20" font-style="italic">not fast, not funny.</text>
</svg>
