{%- comment -%}
  Renders the terminal title bar.

  Usage:
    {% include terminal-chrome.html title="guest@oschei.com — ~ — zsh" %}
{%- endcomment -%}
<div class="term-chrome" role="presentation">
  <span class="dot dot--r" aria-hidden="true"></span>
  <span class="dot dot--y" aria-hidden="true"></span>
  <span class="dot dot--g" aria-hidden="true"></span>
  <span class="title" aria-hidden="true">{{ include.title | default: "guest@oschei.com — ~ — zsh" }}</span>
  <span class="counter" id="carrot-counter" data-active="false" aria-live="polite" aria-atomic="true">
    <span aria-hidden="true">🥕</span>
    <span class="visually-hidden">Easter eggs found: </span>
    <span id="carrot-counter-text">0/7</span>
  </span>
</div>
